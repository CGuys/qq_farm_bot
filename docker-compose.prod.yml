# 公网部署版 compose（所有人可通过 IP:端口 访问）
# 与 docker-compose.yml 区别：
#   1. 端口绑 0.0.0.0，公网可访问
#      ⚠️ 务必登录后改强密码，建议前面套 Nginx+HTTPS+访问白名单
#   2. 抓包端口池默认不映射——绝不开放 18000-18999 到公网
#   3. 管理员账号走 .env 注入，缺失则启动失败
#   4. 数据卷改为同级 ./data，便于备份
#
# 使用：
#   1. 准备 .env（含 FARM_ADMIN_USERNAME / FARM_ADMIN_PASSWORD）
#   2. docker compose -f docker-compose.prod.yml up -d --build

services:
  qq-farm-bot:
    build:
      context: .
      dockerfile: core/Dockerfile
    image: qq-farm-bot:latest
    container_name: qq-farm-bot
    restart: unless-stopped

    ports:
      # 绑所有网卡，公网可通过 服务器IP:3007 访问
      - "3007:3007"
      # ⚠️ 抓包端口池不要对公网开放；需要抓包时仍用 Tailscale 私网
      # - "127.0.0.1:18000-18999:18000-18999"

    volumes:
      - ./data:/app/core/data

    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      ADMIN_PORT: "3007"
      FARM_DATA_DIR: /app/core/data
      FARM_ADMIN_USERNAME: "${FARM_ADMIN_USERNAME:?missing in .env}"
      FARM_ADMIN_PASSWORD: "${FARM_ADMIN_PASSWORD:?missing in .env}"
      CAPTURE_ADVERTISE_IPS: "${CAPTURE_ADVERTISE_IPS:-auto}"

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3007/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
